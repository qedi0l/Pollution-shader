# Pollution Shader - Volumetric Fog Glass Replacement
# Replaces glass block rendering with volumetric fog using raymarching.
# Uses exponential sample distribution and Beer-Lambert law for realistic fog.

# Enable depth texture for view position reconstruction
depth = true

# Use noise texture for fog density variation
noise = true

# Composite pass handles final blending
composite = true

# SSBO for storing pollution cloud world positions, sizes, and colors
# std430 layout: int positionCount (4 bytes, padded to 16) + vec3 positions[1024] (16 bytes each) + vec3 sizes[1024] (16 bytes each) + vec4 colors[1024] (16 bytes each)
# Total: 16 + 1024 * 16 + 1024 * 16 + 1024 * 16 = 49168 bytes.
# The file reference (empty.bin) is REQUIRED: Iris only adds
# GL_DYNAMIC_STORAGE_BIT when a file is present, which is what makes
# glNamedBufferSubData / glNamedClearBufferSubData legal on the buffer.
# Without it the buffer is immutable and updates fail with GL_INVALID_OPERATION.
iris.features.required = SSBO
bufferObject.0 = 49168 empty.bin